[project]
name = "network-science-uzh"
version = "1.1.0"
description = "Coursework for Network Science at the University of Zurich, Fall 2023"
authors = [
    { name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" },
    { name = "Raphael Wäspi" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "joblib>=1.3.2",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.2",
    "nemtropy>=2.1.1",
    "networkx>=3.2.1",
    "numba>=0.58.1",
    "numpy>=1.26.2",
    "pandas>=2.1.4",
    "powerlaw>=1.5",
    "scipy>=1.11.4",
    "tqdm>=4.66.1",
]

[tool.uv]
package = false
# Resolve the library versions that were current when the course ended.
exclude-newer = "2023-12-23T00:00:00Z"
